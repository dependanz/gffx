name: package-foundation-rc

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character commit SHA to qualify; moving branches and tags are rejected
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-foundation-rc-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  verify-revision:
    name: rc-exact-commit-required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse moving refs and invalid commit identifiers
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.revision }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'RC requires an exact lowercase 40-character commit SHA' >&2; exit 1; }

  build-artifacts:
    name: build / ${{ matrix.name }}
    needs: verify-revision
    # The Windows CUDA release wheel is built on a protected, real-NVIDIA host.
    # Never schedule fork PR code on that host; only this owner-dispatched workflow can reach it.
    runs-on: ${{ matrix.platform == 'windows-x64' && fromJSON('["self-hosted","windows","x64","cuda"]') || matrix.runner }}
    environment:
      name: ${{ matrix.platform == 'windows-x64' && 'cuda-hardware' || 'release-candidate-build' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
          # BEGIN GFFX GENERATED RC BUILD MATRIX
          include:
            - name: "windows-x64"
              platform: "windows-x64"
              runner: "windows-2022"
              python: "3.10"
              pytorch: "2.10.0"
              artifact: "win_amd64"
              cibw_arch: "AMD64"
              build_sdist: false
            - name: "linux-x64"
              platform: "linux-x64"
              runner: "ubuntu-24.04"
              python: "3.10"
              pytorch: "2.10.0"
              artifact: "manylinux_2_28_x86_64"
              cibw_arch: "x86_64"
              build_sdist: true
            - name: "linux-arm64"
              platform: "linux-arm64"
              runner: "ubuntu-24.04-arm"
              python: "3.10"
              pytorch: "2.10.0"
              artifact: "manylinux_2_28_aarch64"
              cibw_arch: "aarch64"
              build_sdist: false
            - name: "macos-arm64"
              platform: "macos-arm64"
              runner: "macos-26"
              python: "3.10"
              pytorch: "2.10.0"
              artifact: "macosx_14_0_arm64"
              cibw_arch: "arm64"
              build_sdist: false
          # END GFFX GENERATED RC BUILD MATRIX
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Select build-control CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Build one source archive from the clean candidate checkout
        if: matrix.build_sdist
        shell: bash
        run: |
          python -m pip install build==1.3.0
          python -m build --sdist --outdir wheelhouse
      - name: Require the Windows CUDA 12 toolchain before building the release wheel
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $nvcc = Get-Command nvcc -ErrorAction SilentlyContinue
          if (-not $nvcc) { throw 'Release host requires CUDA Toolkit 12 nvcc on PATH' }
          $nvccOutput = (& nvcc --version | Out-String)
          if ($LASTEXITCODE -ne 0 -or $nvccOutput -notmatch 'release 12[.]') {
            throw 'Release requires a working CUDA 12 toolkit; check NVCC version and PATH'
          }
          Write-Output $nvccOutput
          if (-not (Get-Command nvidia-smi -ErrorAction SilentlyContinue)) {
            throw 'Windows CUDA release host must have a real NVIDIA device'
          }
          & nvidia-smi -L
          if ($LASTEXITCODE -ne 0) { throw 'NVIDIA driver/device probe failed' }
      - name: Build the adapter-enabled ABI3 wheel once
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_BUILD: cp310-*
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_BEFORE_BUILD: >-
            python -m pip install scikit-build-core==1.0.3 cmake==4.4.2 ninja==1.13.0 &&
            python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          CIBW_BEFORE_TEST: >-
            python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          # Release x64 wheels contain CUDA; ARM64 and macOS remain CPU-only.
          CIBW_CONFIG_SETTINGS: ${{ (matrix.platform == 'windows-x64' || matrix.platform == 'linux-x64') && 'cmake.define.GFFX_BUILD_PYTORCH=ON cmake.define.GFFX_ENABLE_CUDA=ON' || 'cmake.define.GFFX_BUILD_PYTORCH=ON' }}
          # Exact digest of the CUDA 12.9 manylinux 2.28 image validated in the Linux build pilot.
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.platform == 'linux-x64' && 'quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda12_9@sha256:d47cabc113c296d832677757f34b3fcd355d107445ecfccedde847f6360f047c' || '' }}
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --exclude libc10.so --exclude libtorch.so
            --exclude libtorch_cpu.so --exclude libcuda.so.1 --exclude libcuda.so
            -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: >-
            python -c "import gffx; c=gffx.capabilities();
            assert c['native_core']['available'] and c['native_core']['abi_version']=='1.0' and not c['gpu_probed'];
            from pathlib import Path;
            platform_name='${{ matrix.platform }}';
            provider={'windows-x64':'gffx_cuda12.dll','linux-x64':'libgffx_cuda12.so'}.get(platform_name);
            assert provider is None or (Path(gffx.__file__).parent/provider).is_file();
            gffx.torch; import torch;
            assert hasattr(torch.ops.gffx_internal, '_foundation_probe');
            print('adapter wheel and provider payload ok', platform_name, torch.__version__)"
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        with:
          output-dir: wheelhouse
      - name: Require real NVIDIA tests on Windows release builder
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          cmake -S . -B build/release-device -DBUILD_TESTING=ON -DGFFX_ENABLE_CUDA=ON -DGFFX_CUDA_RUN_DEVICE_TESTS=ON -DGFFX_BUILD_PYTHON=OFF -DGFFX_BUILD_PYTORCH=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CUDA device configuration failed' }
          cmake --build build/release-device --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'CUDA device build failed' }
          ctest --test-dir build/release-device -C Release --output-on-failure --output-junit build/release-device/ctest.xml
          if ($LASTEXITCODE -ne 0) { throw 'CUDA device CTest failed' }
          python tools/verify_cuda_lane.py build/release-device/ctest.xml --report build/release-device/lane-report.json
          if ($LASTEXITCODE -ne 0) { throw 'CUDA device qualification report failed' }
          $sanitizer = Get-Command compute-sanitizer -ErrorAction SilentlyContinue
          if (-not $sanitizer) { throw 'compute-sanitizer must be available for release' }
          foreach ($target in @('texture_device_parity', 'backward_device_parity')) {
            $exe = "build/release-device/tests/cuda/Release/gffx_test_$target.exe"
            & compute-sanitizer --tool memcheck --error-exitcode 1 --leak-check no $exe
            if ($LASTEXITCODE -ne 0) { throw "CUDA memcheck failed: $target" }
          }
      - name: Prove the exact Windows wheel loads its GPU provider
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -LiteralPath wheelhouse -Filter 'gffx-*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one release wheel' }
          $venv = Join-Path $env:RUNNER_TEMP 'gffx-rc-win-wheel-test'
          python -m venv --clear $venv
          if ($LASTEXITCODE -ne 0) { throw 'Venv creation failed' }
          $py = Join-Path $venv 'Scripts/python.exe'
          & $py -m pip install --no-index --no-deps $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Exact wheel installation failed' }
          Remove-Item Env:GFFX_CUDA_PLUGIN_PATH -ErrorAction SilentlyContinue
          Push-Location $env:RUNNER_TEMP
          try {
            & $py -c "import gffx; from pathlib import Path; assert (Path(gffx.__file__).parent/'gffx_cuda12.dll').is_file(); p=gffx.cuda.capabilities(); assert p['status']=='loaded', p; print('exact Windows CUDA wheel: real device loaded')"
            if ($LASTEXITCODE -ne 0) { throw 'Installed Windows CUDA wheel failed on real device' }
          } finally { Pop-Location }
      - name: Hash artifacts and capture the build environment
        shell: bash
        run: >-
          python tools/ci_smoke.py artifacts
          --directory wheelhouse
          --output wheelhouse/provenance.json
      - name: Retain the exact candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.artifact }}
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 14
      - name: Retain Windows CUDA device qualification
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-hardware-report-windows-rc
          path: |
            build/release-device/ctest.xml
            build/release-device/lane-report.json
          if-no-files-found: error
          retention-days: 14

  linux-cuda-hardware:
    name: release-candidate-linux-nvidia-required
    needs: [verify-revision, build-artifacts]
    # The candidate remains blocked until a real Linux NVIDIA runner is registered.
    # This is never triggered by a pull request or schedule.
    runs-on: [self-hosted, linux, x64, cuda]
    environment: cuda-hardware
    timeout-minutes: 90
    steps:
      - name: Checkout exactly the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          clean: true
      - name: Set up stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Download the exact Linux CUDA release wheel
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: wheel-manylinux_2_28_x86_64
          path: ${{ runner.temp }}/linux-cuda-release-wheel
      - name: Prove installed wheel discovers its bundled plugin on a real NVIDIA device
        shell: bash
        run: |
          set -euo pipefail
          command -v nvcc
          command -v nvidia-smi
          command -v compute-sanitizer
          nvidia-smi -L
          nvcc --version
          WHEEL="$(python -c 'import os; from pathlib import Path; p=list((Path(os.environ["RUNNER_TEMP"])/"linux-cuda-release-wheel").glob("gffx-*.whl")); assert len(p)==1, p; print(p[0])')"
          python -m venv --clear "$RUNNER_TEMP/gffx-rc-linux-cuda-venv"
          "$RUNNER_TEMP/gffx-rc-linux-cuda-venv/bin/python" -m pip install --no-index --no-deps "$WHEEL"
          cd "$RUNNER_TEMP"
          unset GFFX_CUDA_PLUGIN_PATH
          "$RUNNER_TEMP/gffx-rc-linux-cuda-venv/bin/python" -c "import gffx; from pathlib import Path; assert (Path(gffx.__file__).parent/'libgffx_cuda12.so').is_file(); report=gffx.cuda.capabilities(); assert report['status']=='loaded', report; print('real Linux CUDA plugin loaded')"
      - name: Run native hardware parity and operation tests on Linux
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/gffx-rc-linux-device" -DBUILD_TESTING=ON -DGFFX_ENABLE_CUDA=ON -DGFFX_CUDA_RUN_DEVICE_TESTS=ON -DGFFX_BUILD_PYTHON=OFF -DGFFX_BUILD_PYTORCH=OFF
          cmake --build "$RUNNER_TEMP/gffx-rc-linux-device" --config Release --parallel
          ctest --test-dir "$RUNNER_TEMP/gffx-rc-linux-device" -C Release --output-on-failure --output-junit "$RUNNER_TEMP/gffx-rc-linux-device/ctest.xml"
          python tools/verify_cuda_lane.py "$RUNNER_TEMP/gffx-rc-linux-device/ctest.xml" --report "$RUNNER_TEMP/gffx-rc-linux-device/lane-report.json"
          for target in texture_device_parity backward_device_parity; do
            compute-sanitizer --tool memcheck --error-exitcode 1 --leak-check no "$RUNNER_TEMP/gffx-rc-linux-device/tests/cuda/gffx_test_$target"
          done
      - name: Retain Linux NVIDIA device qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuda-hardware-report-linux-rc
          path: |
            ${{ runner.temp }}/gffx-rc-linux-device/ctest.xml
            ${{ runner.temp }}/gffx-rc-linux-device/lane-report.json
          retention-days: 14
          if-no-files-found: warn

  verify-artifacts:
    name: release-candidate-bundle-required
    needs: [build-artifacts, linux-cuda-hardware]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate version and bundle policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Select verifier runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download all four separate exact-artifact receipts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: wheel-*
          path: ${{ runner.temp }}/rc-receipts
          merge-multiple: false
      - name: Verify recorded byte hashes and assemble new, isolated distribution
        shell: bash
        run: >-
          python tools/assemble_candidate_bundle.py
          --artifacts "$RUNNER_TEMP/rc-receipts"
          --out "$RUNNER_TEMP/approved-dist"
      - name: Require complete CPU and CUDA provider release payloads
        shell: bash
        run: python tools/release_bundle_gate.py --dist "$RUNNER_TEMP/approved-dist"
      - name: Retain the complete candidate distribution only after all gates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approved-rc-bundle
          path: ${{ runner.temp }}/approved-dist/
          if-no-files-found: error
          retention-days: 14

  artifact-tests:
    name: artifact / ${{ matrix.platform }} / py${{ matrix.python }} / torch${{ matrix.pytorch }}
    needs: [build-artifacts, verify-artifacts]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
          # BEGIN GFFX GENERATED RC TEST MATRIX
          platform:
            - "windows-x64"
            - "linux-x64"
            - "linux-arm64"
            - "macos-arm64"
          python:
            - "3.10"
            - "3.11"
            - "3.12"
            - "3.13"
            - "3.14"
          pytorch:
            - "2.10.0"
            - "2.11.0"
            - "2.12.1"
            - "2.13.0"
          # BEGIN GFFX GENERATED RC TEST PLATFORM METADATA
          include:
            - platform: "windows-x64"
              runner: "windows-2022"
              artifact: "win_amd64"
              cibw_arch: "AMD64"
            - platform: "linux-x64"
              runner: "ubuntu-24.04"
              artifact: "manylinux_2_28_x86_64"
              cibw_arch: "x86_64"
            - platform: "linux-arm64"
              runner: "ubuntu-24.04-arm"
              artifact: "manylinux_2_28_aarch64"
              cibw_arch: "aarch64"
            - platform: "macos-arm64"
              runner: "macos-26"
              artifact: "macosx_14_0_arm64"
              cibw_arch: "arm64"
          # END GFFX GENERATED RC TEST PLATFORM METADATA
          # END GFFX GENERATED RC TEST MATRIX
    steps:
      - name: Check out only the candidate's smoke tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Select CPython ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Download the exact platform wheel
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: wheel-${{ matrix.artifact }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Install the selected CPU framework and downloaded wheel
        shell: bash
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==${{ matrix.pytorch }}
          WHEEL_PATH="$(python -c 'import os; from pathlib import Path; p=list(Path(os.environ["RUNNER_TEMP"]).joinpath("wheelhouse").glob("gffx-*.whl")); assert len(p)==1, p; print(p[0])')"
          python -m pip install --no-deps "$WHEEL_PATH"
      - name: Probe the installed exact artifact
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          WHEEL_PATH="$(python -c 'import os; from pathlib import Path; p=list(Path(os.environ["RUNNER_TEMP"]).joinpath("wheelhouse").glob("gffx-*.whl")); assert len(p)==1, p; print(p[0])')"
          mkdir -p tools
          cp "$GITHUB_WORKSPACE/tools/ci_smoke.py" tools/ci_smoke.py
          python tools/ci_smoke.py installed \
            --wheel "$WHEEL_PATH" \
            --output "$RUNNER_TEMP/installed-provenance.json"
      - name: Uninstall and prove complete cleanup
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip uninstall --yes gffx
          python tools/ci_smoke.py uninstalled \
            --output "$RUNNER_TEMP/uninstalled-provenance.json"
      - name: Retain per-environment smoke provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.platform }}-py${{ matrix.python }}-torch${{ matrix.pytorch }}
          path: |
            ${{ runner.temp }}/installed-provenance.json
            ${{ runner.temp }}/uninstalled-provenance.json
          if-no-files-found: error
          retention-days: 14

  required:
    name: package-foundation-rc-required
    if: ${{ always() }}
    needs: [linux-cuda-hardware, verify-artifacts, artifact-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all 80 clean artifact environments
        shell: bash
        run: |
          test "${{ needs.linux-cuda-hardware.result }}" = "success"
          test "${{ needs.verify-artifacts.result }}" = "success"
          test "${{ needs.artifact-tests.result }}" = "success"
