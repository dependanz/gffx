name: publish-alpha

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-alpha-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'dependanz/gffx' &&
      github.event.release.tag_name == 'v0.2.0a2' &&
      github.event.release.prerelease == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/gffx/0.2.0a2/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the packaging verifier runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download the already validated release wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --dir dist
      - name: Verify exact approved bytes and metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/verify_release.py --dist dist --tag "$RELEASE_TAG"
      - name: Publish the verified wheel to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
