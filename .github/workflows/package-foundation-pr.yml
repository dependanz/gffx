name: package-foundation-pr

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-foundation-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
          # BEGIN GFFX GENERATED PR MATRIX
          include:
            - name: "linux-x64-floor-floor"
              platform: "linux-x64"
              runner: "ubuntu-24.04"
              python: "3.10"
              pytorch: "2.10.0"
              artifact: "manylinux_2_28_x86_64"
              cibw_arch: "x86_64"
            - name: "linux-x64-floor-current"
              platform: "linux-x64"
              runner: "ubuntu-24.04"
              python: "3.10"
              pytorch: "2.13.0"
              artifact: "manylinux_2_28_x86_64"
              cibw_arch: "x86_64"
            - name: "linux-x64-current-floor"
              platform: "linux-x64"
              runner: "ubuntu-24.04"
              python: "3.14"
              pytorch: "2.10.0"
              artifact: "manylinux_2_28_x86_64"
              cibw_arch: "x86_64"
            - name: "linux-x64-current-current"
              platform: "linux-x64"
              runner: "ubuntu-24.04"
              python: "3.14"
              pytorch: "2.13.0"
              artifact: "manylinux_2_28_x86_64"
              cibw_arch: "x86_64"
            - name: "windows-x64-current-current"
              platform: "windows-x64"
              runner: "windows-2022"
              python: "3.14"
              pytorch: "2.13.0"
              artifact: "win_amd64"
              cibw_arch: "AMD64"
            - name: "linux-arm64-current-current"
              platform: "linux-arm64"
              runner: "ubuntu-24.04-arm"
              python: "3.14"
              pytorch: "2.13.0"
              artifact: "manylinux_2_28_aarch64"
              cibw_arch: "aarch64"
            - name: "macos-arm64-current-current"
              platform: "macos-arm64"
              runner: "macos-26"
              python: "3.14"
              pytorch: "2.13.0"
              artifact: "macosx_14_0_arm64"
              cibw_arch: "arm64"
          # END GFFX GENERATED PR MATRIX
    steps:
      - name: Check out the pull-request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select CPython ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install exact source-development inputs
        shell: bash
        run: |
          python -m pip install \
            pytest==8.3.4 build==1.3.0 scikit-build-core==1.0.3 \
            cmake==4.4.2 ninja==1.13.0
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==${{ matrix.pytorch }}
      - name: Build and install the PyTorch-ready ABI3 wheel
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gffx-adapter-wheel"
          python -m pip wheel . \
            --wheel-dir "$RUNNER_TEMP/gffx-adapter-wheel" \
            --no-deps \
            --no-build-isolation \
            --config-settings cmake.define.GFFX_BUILD_PYTORCH=ON
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/gffx-adapter-wheel/gffx-*.whl
      - name: Run all package-foundation gates
        shell: bash
        run: |
          ADAPTER_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          python tools/verify_foundation.py \
            --work-dir "$RUNNER_TEMP/gffx-foundation-${{ matrix.name }}" \
            --adapter-python "$ADAPTER_PYTHON"

  required:
    name: package-foundation-required
    if: ${{ always() }}
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all seven representative lanes
        shell: bash
        run: test "${{ needs.foundation.result }}" = "success"
