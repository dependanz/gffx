name: package-foundation-nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: Git revision to verify (defaults to the triggering revision)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-foundation-nightly-${{ inputs.revision || github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Plan the rotating 36-lane matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Select policy interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Emit the ISO-week matrix
        id: plan
        run: python tools/ci_matrix.py emit-nightly --github-output matrix

  foundation:
    name: foundation / ${{ matrix.name }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Select CPython ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install exact source-development inputs
        shell: bash
        run: |
          python -m pip install \
            pytest==8.3.4 build==1.3.0 scikit-build-core==1.0.3 \
            cmake==4.4.2 ninja==1.13.0
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==${{ matrix.pytorch }}
      - name: Build and install the PyTorch-ready ABI3 wheel
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gffx-adapter-wheel"
          python -m pip wheel . \
            --wheel-dir "$RUNNER_TEMP/gffx-adapter-wheel" \
            --no-deps \
            --no-build-isolation \
            --config-settings cmake.define.GFFX_BUILD_PYTORCH=ON
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/gffx-adapter-wheel/gffx-*.whl
      - name: Run all package-foundation gates
        shell: bash
        run: |
          ADAPTER_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          python tools/verify_foundation.py \
            --work-dir "$RUNNER_TEMP/gffx-foundation-${{ matrix.name }}" \
            --adapter-python "$ADAPTER_PYTHON"

  python-preview:
    name: preview / linux-x64 / Python 3.15 / PyTorch nightly
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Select preview CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install preview source-development inputs
        shell: bash
        run: |
          python -m pip install \
            pytest==8.3.4 build==1.3.0 scikit-build-core==1.0.3 \
            cmake==4.4.2 ninja==1.13.0
          python -m pip install --pre torch \
            --index-url https://download.pytorch.org/whl/nightly/cpu
      - name: Build and install the preview adapter wheel
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gffx-adapter-wheel"
          python -m pip wheel . \
            --wheel-dir "$RUNNER_TEMP/gffx-adapter-wheel" \
            --no-deps \
            --no-build-isolation \
            --config-settings cmake.define.GFFX_BUILD_PYTORCH=ON
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/gffx-adapter-wheel/gffx-*.whl
      - name: Run preview package-foundation gates
        shell: bash
        run: |
          ADAPTER_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          python tools/verify_foundation.py \
            --work-dir "$RUNNER_TEMP/gffx-foundation-python-preview" \
            --adapter-python "$ADAPTER_PYTHON"

  required:
    name: package-foundation-nightly-required
    if: ${{ always() }}
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all 36 blocking lanes
        shell: bash
        run: test "${{ needs.foundation.result }}" = "success"
