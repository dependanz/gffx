name: publish-multiplatform

# This has NO automatic release, branch-push, pull-request, or schedule trigger.
# Owner manually chooses a stable tag and a successful exact-artifact RC run.
# No candidate checkout or source execution occurs in the OIDC publishing job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable stable tag, e.g. v0.2.2
        required: true
        type: string
      rc_run_id:
        description: Successful exact-artifact package-foundation-rc Actions run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gffx-stable-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: multiplatform-publish-preflight-required
    if: github.repository == 'dependanz/gffx' && github.actor == 'dependanz'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse moving source refs and unexpected callers before checkout
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$RC_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
      - name: Check out the existing stable tag (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Choose verifier Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download complete approved RC distributions from the chosen run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: approved-rc-bundle
          github-token: ${{ github.token }}
          repository: dependanz/gffx
          run-id: ${{ inputs.rc_run_id }}
          path: ${{ runner.temp }}/approved-dist
      - name: Download source and digest receipt for the chosen RC
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rc-candidate-receipt
          github-token: ${{ github.token }}
          repository: dependanz/gffx
          run-id: ${{ inputs.rc_run_id }}
          path: ${{ runner.temp }}/rc-receipt
      - name: Download Windows real NVIDIA test evidence from the same RC
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cuda-hardware-report-windows-rc
          github-token: ${{ github.token }}
          repository: dependanz/gffx
          run-id: ${{ inputs.rc_run_id }}
          path: ${{ runner.temp }}/windows-device
      - name: Require matching tag, successful RC, all platform bytes and Windows NVIDIA evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
        run: |
          python tools/verify_multiplatform_publication.py \
            --tag "$RELEASE_TAG" --run-id "$RC_RUN_ID" \
            --dist "$RUNNER_TEMP/approved-dist" \
            --receipt "$RUNNER_TEMP/rc-receipt/rc-candidate-receipt.json" \
            --windows-report "$RUNNER_TEMP/windows-device/lane-report.json"
      - name: Preserve verified exact bytes for the separate publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vetted-stable-pypi-distributions
          path: ${{ runner.temp }}/approved-dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: owner-approved-trusted-pypi-upload
    needs: preflight
    if: github.repository == 'dependanz/gffx' && github.actor == 'dependanz'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/gffx/
    permissions:
      contents: read
      id-token: write
    steps:
      # Do NOT checkout or run candidate repository code after OIDC permission is granted.
      - name: Retrieve only the reviewed artifact bytes
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: vetted-stable-pypi-distributions
          path: dist/
      - name: Upload exactly the qualified complete stable distribution set
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          attestations: true
