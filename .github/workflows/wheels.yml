# Phase 1 Step 7 wheel builds.
#
# Scope: this workflow builds and hashes the four planned CPU wheels plus the sdist, and runs the
# in-container base-import smoke test defined by [tool.cibuildwheel] test-command. It is a
# packaging gate only. It makes no operation-conformance, performance, or GPU support claim, and
# it does not publish to any index.
#
# It deliberately implements only the release-candidate wheel-build portion of the CI cadence.
# The full pull-request, nightly, and 80-environment matrices belong to Step 12.
#
# Runners follow the table in PYTORCH_SUPPORT_MATRIX_V0_1.md.

name: wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheels:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win_amd64
            os: windows-2022
            archs: AMD64
          - target: manylinux_2_28_x86_64
            os: ubuntu-24.04
            archs: x86_64
          - target: manylinux_2_28_aarch64
            os: ubuntu-24.04-arm
            archs: aarch64
          - target: macosx_14_0_arm64
            os: macos-26
            archs: arm64

    steps:
      - uses: actions/checkout@v4

      # cibuildwheel supplies its own interpreters for the builds themselves; this one exists so
      # the hashing step below has a predictable `python` on every runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # macOS ARM64 wheels advertise macOS 14+, matching the support matrix.
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Hash artifacts
        shell: bash
        run: |
          cd wheelhouse
          python -c "
          import hashlib, os
          for name in sorted(os.listdir('.')):
              data = open(name, 'rb').read()
              print('%s  %d bytes  sha256=%s' % (name, len(data), hashlib.sha256(data).hexdigest()))
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist

      - name: Hash artifact
        run: |
          python -c "
          import hashlib, os
          for name in sorted(os.listdir('dist')):
              data = open(os.path.join('dist', name), 'rb').read()
              print('%s  %d bytes  sha256=%s' % (name, len(data), hashlib.sha256(data).hexdigest()))
          "

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error
