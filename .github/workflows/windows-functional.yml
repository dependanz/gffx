name: windows-functional
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
  schedule:
  - cron: 37 2 * * *
permissions:
  contents: read
concurrency:
  group: windows-functional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - name: Check out the exact revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.10'
    - name: Select CPU builder and dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip==26.2.1
        python -m pip download --only-binary=:all: --no-deps torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu --dest framework
        $framework = (Get-ChildItem framework/torch-*.whl).FullName
        python -m pip install --only-binary=:all: pytest==9.0.3 "$framework"
        if ($LASTEXITCODE -ne 0) { throw 'CPU framework setup failed' }
        python -m pip install scikit-build-core==1.0.3 cmake==4.4.2 ninja==1.13.0 delvewheel==1.13.2
    - name: Build one CPU test artifact
      shell: pwsh
      run: |
        $python = (Get-Command python).Source
        python tools/cpu_wheel.py build --python "$python" --work-dir ci-wheel --generator "Visual Studio 17 2022"
    - name: Retain windows-functional-wheel
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-functional-wheel
        path: ci-wheel/repaired/*.whl
        if-no-files-found: error
  cpu:
    name: cpu (${{ matrix.python }}, ${{ matrix.torch }})
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        torch:
        - '2.10.0'
        - '2.14.1'
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
    - name: Check out the exact revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python }}
    - name: Select the explicit CPU framework
      shell: pwsh
      run: |
        python -m pip install --upgrade pip==26.2.1
        python -m pip download --only-binary=:all: --no-deps "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu --dest framework
        $framework = (Get-ChildItem framework/torch-*.whl).FullName
        python -m pip install --only-binary=:all: pytest==9.0.3 "$framework"
        if ($LASTEXITCODE -ne 0) { throw 'CPU framework setup failed' }
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
      with:
        name: windows-functional-wheel
        path: dist
    - name: Test installed artifact operations and derivatives
      shell: pwsh
      run: |
        $wheel = (Get-ChildItem dist/gffx-*.whl).FullName
        python -m pip install --no-index --no-deps "$wheel"
        if ($LASTEXITCODE -ne 0) { throw 'wheel install failed' }
        python tools/stable_validation.py --wheel "$wheel" --profile cpu --output results
        if ($LASTEXITCODE -ne 0) { throw 'functional cohort failed' }
        python tools/simple_scene_validation.py --wheel "$wheel" --device cpu --output scene-results
        if ($LASTEXITCODE -ne 0) { throw 'simple scene validation failed' }
        python -m pip check
    - name: Prove base import and uninstall without a framework
      if: matrix.python == '3.10' && matrix.torch == '2.14.1'
      shell: pwsh
      run: |
        $wheel = (Get-ChildItem dist/gffx-*.whl).FullName
        python tools/stable_installation.py --wheel "$wheel" --output installation-results
        if ($LASTEXITCODE -ne 0) { throw "installation checks failed" }
    - name: Retain windows-cpu-py${{ matrix.python }}
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-cpu-py${{ matrix.python }}-torch${{ matrix.torch }}
        path: |-
          results
          scene-results
          installation-results
        if-no-files-found: error
