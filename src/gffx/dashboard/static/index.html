<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gffx dashboard</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-gffx-app="general">
<header class="bar">
  <span class="brand">gffx dashboard</span>
  <label>run <select id="run"></select></label>
  <label>layout <select id="layout"><option value="">auto</option></select></label>
  <button id="save" title="Save the current layout under a name">save</button>
  <button id="edit" title="Move, resize, rebind or remove panels">edit</button>
  <button id="add" hidden>add panel</button>
  <label>delivery <select id="delivery"><option value="low">low bandwidth</option><option value="standard">standard</option><option value="paused">paused</option></select></label>
  <span id="status" class="status">connecting</span>
</header>
<div id="resources" class="resource-status" role="status">Resource limits require the updated server. Low bandwidth still uses data; pause when not viewing.</div>
<section class="reference-bar" aria-label="Testing page reference">
  <span id="page-reference">Page identity pending</span>
  <button id="copy-reference">copy page reference</button>
  <button id="copy-link">copy link</button>
  <textarea id="reference-fallback" hidden readonly aria-label="Reference to copy manually"></textarea>
</section>
<main id="grid" class="grid"></main>
<script type="module" src="/app.js"></script>
</body>
</html>
