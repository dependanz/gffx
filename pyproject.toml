[build-system]
# Build-only dependencies, pinned for reproducible source and wheel builds. None of these is a
# runtime dependency: an installed wheel needs no build backend, CMake, generator, or C compiler.
requires = ["scikit-build-core==1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "gffx"
version = "0.2.0.dev0"
description = "Portable differentiable graphics and mesh operations"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Danzel Serrano", email = "danzel.serrano@gmail.com"},
]
dependencies = []

[project.urls]
Repository = "https://github.com/dependanz/gffx"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/gffx"]

# CPU-only is the default configuration; CUDA stays explicitly opt-in (Step 9).
# Tests are a developer/CI concern and are never built while producing a distribution.
# CMake and the generator are pinned through the backend, which injects them as build-only
# dependencies; pinning them in build-system.requires instead is rejected by scikit-build-core.
cmake.version = "==4.4.2"
ninja.version = "==1.13.0"

cmake.define.BUILD_TESTING = "OFF"
cmake.define.GFFX_BUILD_PYTHON = "ON"
cmake.define.GFFX_ENABLE_CUDA = "OFF"

# The wheel carries the private gffx._core extension built against the CPython 3.10 stable ABI,
# so one artifact serves 3.10+ and the abi3 tag in PYTORCH_SUPPORT_MATRIX_V0_1.md is accurate.
wheel.py-api = "cp310"

sdist.exclude = ["build", "dist", "*.egg-info", "__pycache__", ".pytest_cache"]

[tool.cibuildwheel]
# One abi3 wheel per platform serves CPython 3.10+, so only the 3.10 build is needed.
build = "cp310-*"
skip = "*-musllinux_*"
build-frontend = "build"

# Prove the wheel actually works inside the target container rather than only that it built.
test-command = "python -c \"import gffx; c = gffx.capabilities(); assert c['native_core']['available'], c; assert c['native_core']['abi_version'] == '1.0', c; assert c['native_core']['limited_api'] == '0x030A0000', c; assert c['gpu_probed'] is False, c; print('wheel ok:', c['python_version'], c['native_core']['abi_version'])\""

[tool.cibuildwheel.linux]
# The support matrix advertises glibc 2.28+, which is exactly the manylinux_2_28 policy.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
